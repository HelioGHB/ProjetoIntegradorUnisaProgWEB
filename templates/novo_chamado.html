{% extends 'base.html' %}
{% from 'campos.html' import campo %}
{% block title %}Abrir chamado · SIGETEC{% endblock %}
{% block content %}
<section class="card">
    <h1>Abrir chamado</h1>
    <form method="post">
        {{ form.hidden_tag() }}
        {{ campo(form.titulo) }}{{ campo(form.descricao) }}{{ campo(form.prioridade) }}
        <button type="submit">Registrar chamado</button>
    </form>
</section>
{% endblock %}
